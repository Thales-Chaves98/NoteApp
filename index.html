<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotesApp</title>
    <link rel="stylesheet" href="styles/app.css">
    <link rel="shortcut icon" href="assets/noteFavicon.png" type="image/x-icon">
</head>
<body>
    <header>
        <div class="logo"></div>
        <input type="text" class="search-input" placeholder="Pesquisar Notas">
        <button class="theme-toggle"></button>
    </header>

    <main>
        <section id="toolbar">
            <div id="toolbar-actions">
                <button class="create-note-btn"></button>
            </div>

            <div id="toolbar-tabs">
                <button class="filter-tab" data-id="1"></button>
                <button class="filter-tab" data-id="2"></button>
                <button class="filter-tab" data-id="3"></button>
            </div>

            <div id="toolbar-sort">
                 <select class="sort-select"></select>
            </div>
        </section>
        
        <section id="notes-container">
            <!--Show notes here-->
        </section>
    
    </main>

    <footer>

    </footer>

    <section id="note-modal" class="modal" >
        <div class="modal-content">
                <h1>NOVA NOTA</h1>
            <form class="note-form">

                <div class="form-group">
                    <label for="note-title">Título:</label>
                    <input type="text" id="note-title" class="form-input" autocomplete="off">

                </div> <!--Titulo-->
                
                <div class="form-group"> 
                    <label for="note-content">Conteúdo:</label>
                    <textarea id="note-content" class="form-textarea" rows="8"></textarea>
                </div><!--Conteudo-->

                <div class="form-group">
                    <label for="category-selector">Categorias:</label>
                    <select id="category-selector" class="form-select">

                    </select>
                </div><!--Categorias-->

                <div class="form-group">
                    <label>Cor:</label>
                    <div class="color-picker">
                        <button type="button" class="color-option" data-color="red"></button>
                        <button type="button" class="color-option" data-color="blue"></button>
                        <button type="button" class="color-option" data-color="green"></button>
                        <button type="button" class="color-option" data-color="yellow"></button>
                    </div>
                </div><!--Cores-->


                <div class="form-group">
                    <label for="tag-input">Tags:</label>
                    
                    <div class="tag-input-group">
                        <input type="text" id="tag-input" class="form-input" placeholder="Digite uma tag">
                        <button type="button" class="add-tag-btn">+</button>

                    </div>
                    
                    <div class="tag-list">
                        <!-- Selected tags will be here! -->
                    </div>

                </div><!--Tags-->
                
                <div class="modal-actions">
                    <button type="button" class="cancel-btn" >Cancelar</button>
                    <button type="submit" class="save-btn" >Salvar</button>

                </div><!--Açoes-->

            </form>
            
            
        </div>
    </section>
    
</body>
</html>
