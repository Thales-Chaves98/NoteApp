<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotesApp</title>
    <link rel="stylesheet" href="styles/app.css">
    <link rel="shortcut icon" href="assets/noteFavicon.png" type="image/x-icon">
    <link rel="stylesheet"href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"/>
</head>
<body>
    <header>
        <div class="logo">
            <span class="material-symbols-outlined">summarize</span>
        </div>
        <input type="text" class="search-input" placeholder="Pesquisar Notas">
        <button class="theme-toggle material-symbols-outlined">brightness_7</button>
    </header>

    <main>
        <section id="toolbar">

            <div id="toolbar-actions">
                <button class="create-note-btn"><span class="create-note-txt">ADICIONAR NOVA NOTA </span></button>
            </div>

            <div id="toolbar-tabs">
                <button class="filter-tab" data-id="1">TODAS</button>
                <button class="filter-tab" data-id="2">FAVORITADAS</button>
                <button class="filter-tab" data-id="3">ARQUIVADAS</button>
            </div>

            <div id="toolbar-sort">
                 <select class="sort-select">
                    <option value="recent">MAIS RECENTES</option>
                    <option value="oldest">MAIS ANTIGAS</option>
                    <option value="title-asc">TÍTULO (A-Z)</option>
                    <option value="title-desc">TÍTULO (Z-A)</option>
                 </select>
            </div>
        </section>
        
        <section id="notes-container">
            
            <div class="empty-state">
                <div class="empty-state-header">
                    <span class="material-symbols-outlined">scan_delete</span>
                </div>

                <div class="empty-state-content" >
                    <h2>Nenhuma nota encontrada.</h2>
                    <p>Clique em "Nova Nota" para criar uma nota.</p>
                </div>
            </div>
            
            <article class="note-card">
                <div class="note-header">
                    <button class="pin-btn"><span class="material-symbols-outlined">keep</span></button>
                    <button class="favorite-btn"><span class="material-symbols-outlined">star</span></button>
                    <button class="note-menu-btn"><span class="material-symbols-outlined">more_vert</span></button></button>
                </div>

                <div class="note-content">
                    <div class="note-title">
                    </div>

                    <div class="note-text">
                    </div>

                    <div class="note-category">
                    </div>

                    <div class="note-tags">  
                    </div>

                    <div class="note-dates">
                    </div>

                </div>
            </article>
        </section>
    
    </main>

    <footer>
        <P class="footer-text">Notes Manager made by <a href="https://github.com/Thales-Chaves98">Thales Chaves</a></P>
    </footer>

    

    <section id="note-modal" class="modal" >
        <div class="modal-content">
                <h1>NOVA NOTA</h1>
            <form class="note-form">

                <div class="form-group">
                    <label for="note-title">Título:</label>
                    <input type="text" id="note-title" class="form-input" autocomplete="off" placeholder="Digite um título">

                </div> <!--Titulo-->
                
                <div class="form-group"> 
                    <label for="note-content">Conteúdo:</label>
                    <textarea id="note-content" class="form-textarea" rows="8"></textarea>
                </div><!--Conteudo-->

                <div class="form-group">
                    <label for="category-selector">Categorias:</label>
                    <select id="category-selector" class="form-select">
                        <option value="Estudo">Estudo</option>
                        <option value="Trabalho">Trabalho</option>
                        <option value="Tarefa">Tarefa</option>
                        <option value="Outros">Outros</option>

                    </select>
                </div><!--Categorias-->

                <div class="form-group">
                    <label>Cor:</label>
                    <div class="color-picker">
                        <button type="button" class="color-option" data-color="red"></button>
                        <button type="button" class="color-option" data-color="blue"></button>
                        <button type="button" class="color-option" data-color="green"></button>
                        <button type="button" class="color-option" data-color="yellow"></button>
                    </div>
                </div><!--Cores-->


                <div class="form-group">
                    <label for="tag-input">Tags:</label>
                    
                    <div class="tag-input-group">
                        <input type="text" id="tag-input" class="form-input" placeholder="Digite uma tag">
                        <button type="button" class="add-tag-btn"><span class="material-symbols-outlined">add_circle</span></button>

                    </div>
                    
                    <div class="tag-list">
                        <!-- Selected tags will be here! -->
                       
                    </div>

                </div><!--Tags-->
                
                <div class="modal-actions">
                    <button id="cancel-note-btn" type="button" class="cancel-btn" >Cancelar</button>
                    <button id="save-note-btn" type="button" class="save-btn" >Salvar</button>

                </div><!--Açoes-->

            </form>
            
            
        </div>
    </section>

    <section id="delete-modal" class="modal" >
        <div class="modal-content">
            <h2>EXCLUIR NOTA.</h2>
            <p>Tem certeza que deseja excluir essa nota ?</p>
            <p>Essa ação não poderá ser desfeita !</p>

            <div class="modal-actions">
                <button id="cancel-delete-btn" class="cancel-btn">Cancelar</button>
                <button id="confirm-delete-btn" class="save-btn">Excluir</button>
            </div>
        </div>
    </section>
    
    <script src="scripts/app.js"></script>
</body>
</html>
